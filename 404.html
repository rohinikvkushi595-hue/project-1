
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found - NESTORA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      background: #f7f5ef;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .error-container {
      width: 100%;
      max-width: 1000px;
      min-height: 520px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: white;
      box-shadow: 0 15px 60px rgba(0,0,0,.08);
    }

    .error-image {
      min-height: 520px;
      position: relative;
    }

    .error-image img {
      height: 100%;
      position: absolute;
      inset: 0;
    }

    .error-content {
      padding: 60px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .error-logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #24372e;
      margin-bottom: 65px;
    }

    .error-logo span {
      color: #c49a62;
    }

    .error-number {
      font-family: 'Playfair Display', serif;
      font-size: 105px;
      line-height: 1;
      color: #c49a62;
    }

    .error-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #24372e;
      margin: 15px 0;
    }

    .error-content p {
      color: #777b73;
      font-size: 14px;
      line-height: 1.9;
      margin-bottom: 30px;
    }

    .home-button {
      display: inline-block;
      background: #24372e;
      color: white;
      padding: 16px 25px;
      width: fit-content;
      font-size: 12px;
      font-weight: 700;
      transition: .3s;
    }

    .home-button:hover {
      background: #c49a62;
      transform: translateY(-3px);
    }

    .error-note {
      margin-top: 45px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #c49a62;
    }

    @media(max-width: 650px) {
      .error-container {
        grid-template-columns: 1fr;
      }

      .error-image {
        min-height: 230px;
      }

      .error-content {
        padding: 35px 25px;
      }

      .error-logo {
        margin-bottom: 35px;
      }

      .error-number {
        font-size: 75px;
      }

      .error-content h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <main class="error-container">

    <div class="error-image">
      <img
        src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=900"
        alt="Beautiful Nestora interior">
    </div>

    <div class="error-content">

      <a href="index.html" class="error-logo">
        NEST<span>ORA.</span>
      </a>

      <p class="eyebrow">OOPS! SOMETHING WENT WRONG</p>

      <div class="error-number">404</div>

      <h1>This space is empty.</h1>

      <p>
        Looks like the page you're searching for has
        moved or doesn't exist. Don't worry, your
        beautiful home journey is just one click away.
      </p>

      <a href="index.html" class="home-button">
        ← BACK TO HOME
      </a>

      <div class="error-note">
        NESTORA · DESIGNED FOR BEAUTIFUL LIVING
      </div>

    </div>
  </main>

</body>
</html>
