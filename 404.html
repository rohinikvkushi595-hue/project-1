
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | SKYORA</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      min-height: 100vh;
      background: #f5f5ef;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .error-box {
      max-width: 1000px;
      width: 100%;
      min-height: 530px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: white;
      box-shadow: 0 15px 50px rgba(0,0,0,.08);
    }

    .error-image {
      min-height: 530px;
    }

    .error-image img {
      height: 100%;
    }

    .error-content {
      padding: 55px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .error-logo {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 55px;
    }

    .error-logo span {
      color: #e9a45b;
    }

    .error-number {
      font-family: 'Playfair Display', serif;
      font-size: 110px;
      color: #e9a45b;
      line-height: 1;
    }

    .error-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #142b30;
      margin: 15px 0;
    }

    .error-content p {
      font-size: 13px;
      line-height: 1.9;
      color: #727c7b;
      margin-bottom: 28px;
    }

    .home-button {
      background: #142b30;
      color: white;
      display: inline-block;
      width: fit-content;
      padding: 16px 25px;
      font-size: 12px;
      font-weight: bold;
      transition: .3s;
    }

    .home-button:hover {
      background: #e9a45b;
      color: #142b30;
      transform: translateY(-3px);
    }

    .error-footer {
      color: #e9a45b;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 45px;
    }

    @media(max-width: 650px) {
      .error-box {
        grid-template-columns: 1fr;
      }

      .error-image {
        min-height: 230px;
      }

      .error-content {
        padding: 35px 25px;
      }

      .error-logo {
        margin-bottom: 30px;
      }

      .error-number {
        font-size: 75px;
      }

      .error-content h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="error-box">

    <div class="error-image">
      <img
        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900"
        alt="Beautiful mountain destination">
    </div>

    <div class="error-content">

      <a href="index.html" class="error-logo">
        SKY<span>ORA.</span>
      </a>

      <div class="eyebrow">OOPS! WRONG DESTINATION</div>

      <div class="error-number">404</div>

      <h1>Lost Your Way?</h1>

      <p>
        Looks like this destination doesn't exist.
        Every great journey has a wrong turn.
        Let's take you back to where your adventure begins.
      </p>

      <a href="index.html" class="home-button">
        ← BACK TO HOME
      </a>

      <div class="error-footer">
        SKYORA · EXPLORE BEYOND LIMITS
      </div>

    </div>

  </main>

</body>
</html>
